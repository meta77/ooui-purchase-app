<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Purchase List - OOUI Preview</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Vue 3 CDN -->
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
        body {
            font-family: 'Inter', sans-serif;
        }
    </style>
</head>
<body>
    <div id="app">
        <div class="min-h-screen bg-gray-50">
            <!-- Header -->
            <header class="border-b border-gray-200 bg-white">
                <div class="mx-auto flex max-w-5xl items-center justify-between px-4 py-4 sm:px-6">
                    <div>
                        <h1 class="text-2xl font-semibold text-gray-900">
                            Purchase List
                        </h1>
                        <p class="mt-1 text-sm text-gray-500">
                            仕入れ一覧
                        </p>
                    </div>

                    <button class="rounded-xl bg-black px-4 py-2 text-sm font-medium text-white shadow-sm transition hover:bg-gray-800 active:scale-[0.98]">
                        + 新規作成
                    </button>
                </div>
            </header>

            <!-- Content -->
            <main class="mx-auto max-w-5xl px-4 py-6 sm:px-6">
                <div class="space-y-4">
                    <div v-for="purchase in purchases" :key="purchase.id"
                        class="group cursor-pointer rounded-2xl border border-gray-200 bg-white p-5 shadow-sm transition-all duration-200 hover:-translate-y-0.5 hover:shadow-md">
                        
                        <!-- Mobile -->
                        <div class="flex flex-col gap-4 sm:hidden">
                            <div>
                                <p class="text-xs font-medium uppercase tracking-wide text-gray-400">
                                    Purchase ID
                                </p>
                                <p class="mt-1 text-lg font-semibold text-gray-900">
                                    {{ purchase.id }}
                                </p>
                            </div>

                            <div class="flex items-center justify-between">
                                <div>
                                    <p class="text-xs font-medium uppercase tracking-wide text-gray-400">
                                        Date
                                    </p>
                                    <p class="mt-1 text-sm text-gray-700">
                                        {{ purchase.date }}
                                    </p>
                                </div>

                                <div class="text-right">
                                    <p class="text-xs font-medium uppercase tracking-wide text-gray-400">
                                        Total
                                    </p>
                                    <p class="mt-1 text-lg font-semibold text-gray-900">
                                        ¥{{ formatPrice(purchase.total) }}
                                    </p>
                                </div>
                            </div>
                        </div>

                        <!-- Desktop -->
                        <div class="hidden items-center justify-between sm:flex">
                            <div class="min-w-0 flex-1">
                                <p class="text-xs font-medium uppercase tracking-wide text-gray-400">
                                    Purchase ID
                                </p>
                                <p class="mt-1 truncate text-lg font-semibold text-gray-900">
                                    {{ purchase.id }}
                                </p>
                            </div>

                            <div class="w-48">
                                <p class="text-xs font-medium uppercase tracking-wide text-gray-400">
                                    Date
                                </p>
                                <p class="mt-1 text-sm text-gray-700">
                                    {{ purchase.date }}
                                </p>
                            </div>

                            <div class="w-40 text-right">
                                <p class="text-xs font-medium uppercase tracking-wide text-gray-400">
                                    Total
                                </p>
                                <p class="mt-1 text-lg font-semibold text-gray-900">
                                    ¥{{ formatPrice(purchase.total) }}
                                </p>
                            </div>
                        </div>
                    </div>
                </div>
            </main>
        </div>
    </div>

    <script>
        const { createApp } = Vue

        createApp({
            data() {
                return {
                    purchases: [
                        { id: 'P-10021', date: '2026/05/20', total: 12400 },
                        { id: 'P-10022', date: '2026/05/21', total: 8500 },
                        { id: 'P-10023', date: '2026/05/22', total: 21300 },
                        { id: 'P-10024', date: '2026/05/23', total: 5600 },
                    ]
                }
            },
            methods: {
                formatPrice(value) {
                    return new Intl.NumberFormat('ja-JP').format(value)
                }
            }
        }).mount('#app')
    </script>
</body>
</html>
